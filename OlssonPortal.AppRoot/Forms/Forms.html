    <script>
        var id = $.url('?id');
        console.log(id);
        $("#doc-details-link").attr("href", "form1?id=" + id);

        var url = baseApiUrl + "/api/View_FormData/" + id;
  
        var callBackStatus = true;

        $(document).ready(function () {

            //show spinner
            AjaxLoader("a", "Please Wait", false)
            var success = function(){
            };

            var token = sessionStorage.getItem(tokenKey);
            //console.log(token);
            var headers = {};
            if (token) {
                headers.Authorization = 'Bearer ' + token;
            }


            $.ajax({
                url: url,
                async: true,
                cache: false,
                type: "Get",
            })
             .done(function (data, status, jqXHR) {
                 msg = "Done";
                // console.log(msg);
             })
         .success(function (data, status, jqXHR) {
            // console.log(data);
             if (data.length == 0) {
                 return;
             }
    
             $("h1").text(data[0].formName);
             $("#breadCrumbs").html('<a href="index.html"  rel="external" data-ajax="false">Forms</a> >' + data[0].formName);
             //check for null data
             if (data == null || (data.length > 0 && data[0].documentId == null)) {
                 var gridLnk = '<li>No available data to display';
                 $("#gridLnks").append(gridLnk).trigger('create');
                 $("#gridLnks").listview('refresh')
                 return;
             }
             $.each(data, function (index, d) {

                 var gridLnk = '<li><a href="form1?id=' + d.formID + '&row=' + d.rowID + '"  rel="external" data-ajax="false"> <h2>' + d.documentTitle + '</h2><p><strong>01/15/2015 9:00 PM ' + d.formStatus + '</strong></p></a></li>'
                 $("#gridLnks").append(gridLnk).trigger('create');
                 $("#gridLnks").listview('refresh')

             });


         })
         .fail(function (jqXHR, textStatus, err) {
             var error = $.parseJSON(jqXHR.responseText);
             msg = "Error: The server responded with the following error (" + err + ") " + error.message;
           //  console.log(msg);
         })

            getFormLinks()
            //hide spinner
            $.mobile.loading("hide");

       });

        var callBackFn = function (data) {

            if (!callBackStatus) {
                return;
            }
          
            data = $.parseJSON(data);
            if (data.length == 0) {
                return;
            }
             $("h1").text(data[0].FormName);
            // console.log(data);
             $.each(data, function (index, d) {

                 var gridLnk = '<li><a href="form1?id=' + d.DocumentID + '"  rel="external" data-ajax="false"> <h2>' + d.DocumentTitle + '</h2><p><strong>01/15/2015 9:00 PM ' + d.FormStatus + '</strong></p></a></li>'
                $("#gridLnks").append(gridLnk).trigger('create');
                $("#gridLnks").listview('refresh')

            });
        }

      

    </script>
