<html>
<head>
    <title>Olsson Roofing</title>
    <meta charset="utf-8">

    <link href="themes/jquery.mobile.icons.min.css" rel="stylesheet" />
    <link href="themes/olssonThemes.css" rel="stylesheet" />
    <link href="themes/olssonThemes.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="js/jquery/jquery.mobile.structure-1.4.5.min.css" />
    <script src="js/jquery/jquery-1.11.1.min.js"></script>
    <script src="js/jquery/jquery-u-1.11.4.js"></script>

    <script src="js/jquery/jquery.mobile-1.4.5.min.js"></script>

    <style>
        .dispaly-none {
            display: none;
        }

        .dispaly-block {
            display: block;
        }

        .bg-cust-fieldset {
            background: #efefef;
            padding: 15px !important;
            margin-bottom: 10px !important;

        }

            float: left !important;
        }

        .right {
            float: right;
        }

        .center {
            text-align: center;
        }

        .custom-btn-medium {
            width: 200px !important;
        }
    </style>
    <style>
        table * {
            padding: 0px;
            margin: 0px;
        }

        table td h2 {
            font-size: 15px;
        }

        table td a {
            font-size: 12px;
        }

        table .ui-btn {
            float: right;
        }
    </style>

    <script>
        $(document).on("pagecreate", function () {
            $("body > [data-role='panel']").panel();
            $("body > [data-role='panel'] [data-role='listview']").listview();
        });
        $(document).one("pageshow", function () {
            $("body > [data-role='header']").toolbar();
            $("body > [data-role='header'] [data-role='navbar']").navbar();

</head>

<body>
    <div data-role="page" class="type-interior" data-theme="a" id="form-list">
        <div data-role="header" data-theme="b">
            <div class="ui-body">
                <div class="ui-grid-b">
                    <div class="ui-block-a">
                        <a href="#inside-a" class="ui-btn ui-shadow  ui-corner-all ui-btn-inline  ui-icon-bars  ui-btn-icon-notext ui-btn-c">Menu</a>
                        <a href="index.html" class="ui-btn ui-shadow ui-corner-all ui-btn-inline ui-icon-arrow-l ui-btn-icon-notext ui-btn-c" rel="external" data-ajax="false">Previous</a>
                    </div>
                    <div class="ui-block-b"><img src="css/img/olssonLogo-small.png" /></div>
                    <div class="ui-block-c"><span class="ui-btn ui-shadow  ui-corner-all ui-btn-inline  ui-icon-lock  ui-btn-icon-notext ui-btn-c" style="border:0;"></span> Hello <span id="username"></span>!</div>
                </div>
            </div>
        </div>
        <div style="text-align:right; font-size:12px; margin-right:10px;">Forms/Customer Forms</div>
        <div data-role="content">
            <div data-role="content" style="margin:0; padding:0">
                <a id="doc-details-link" href="formDetails.aspx?id=0" rel="external" data-ajax="false" class="ui-btn ui-shadow ui-corner-all ui-btn-inline ui-icon-plus ui-btn-icon-right right ui-btn-f" data-iconpos="notext" data-inline="true" data-mini="true">Add new Form</a>
            </div>
            <div data-role="collapsible" data-theme="e" data-collapsed="false" name="DataEntrySection" id="DataEntrySection" style="margin:0; padding:0" class="ui-collapsible ui-collapsible-inset ui-corner-all ui-collapsible-themed-content" data-expanded-icon="carat-u">
                <h4>Form Items</h4>
                <div data-role="main" class="ui-content" style="margin:0; padding:0">
                    <table border="0" style="border-color:#efefef;margin:0; padding:0" data-role="table" id="gridLnks" data-mode="static" data-mini="true" class="ui-body-d ui-shadow table-stripe ui-responsive"></table>
                </div>
            </div>

            <div data-role="collapsible" data-theme="e" data-collapsed="true" name="DeletedSection" id="DeletedSection" class="ui-collapsible ui-collapsible-inset ui-corner-all ui-collapsible-themed-content" data-expanded-icon="carat-u">
                <h4>Deleted Items</h4>
                <span id="sectionIsEmpty">No deleted items found.</span>

                <table border="0" style="border-color:#efefef;"  data-role="table" id="delGridLnks" data-mode="static " data-mini="true" class="ui-body-d ui-shadow table-stripe ui-responsive"></table>
            </div>

        </div>

        <div data-role="footer" class="footer-docs" data-theme="a">
            <p class="jqm-version"></p>
            <p style="text-align:right; margin-right:20px;">&copy; <span id="spanYear"></span> - Olsson Roofing</p>
        </div>
    </div>

    <div data-role="panel" id="inside-a" data-position="left" data-display="overlay" data-theme="b">
        <ul data-role="listview" id="userForms">
            <li data-icon="delete"><a href="#" data-theme="e" data-rel="close"></a> </li>
            <li data-icon="home"><a href="index.html" rel="external" data-ajax="false" data-theme="e" data-rel="home">Home</a> </li>
            <li></li>
            <li><a href="#" rel="external" data-ajax="false" onclick="signOut()">Sign Out</a></li>
        </ul>
    </div>


    <script src="js/app.js"></script>
    <script src="libs/jqm/url.min.js"></script>
    <script src="libs/jqm/datePickUp.js"></script>
    <script>
        $(document).bind("mobileinit", function () {
            $.mobile.page.prototype.options.domCache = false;
        });


        var id = $.url('?id');
       
        $("#doc-details-link").attr("href", "formDetails.aspx?id=" + id);

        var url = baseApiUrl + "/api/View_FormData/" + id;

        var callBackStatus = true;
        var token = null;
        $(document).ready(function () {

            //show spinner
            AjaxLoader("a", "Please Wait", false)
            token = sessionStorage.getItem(tokenKey);
            loadDocuments(url)
            getFormLinks()
            documentReady();
            //hide spinner
            $.mobile.loading("hide");

        });

        function loadDocuments(url) {
            $.ajax({
                url: url,
                async: true,
                cache: false,
                type: "Get",
                headers: { 'Authorization': 'Bearer ' + token },
            })
            .done(function (data, status, jqXHR) {
                msg = "Done";
                // console.log(msg);
            })
            .success(function (data, status, jqXHR) {
                // console.log(data);
                if (data == null || data.length == 0) {
                    var gridLnk = '<tr><td style="color:red; text-align:center;">No data available.</td></tr>'
                    $("#gridLnks").append(gridLnk).trigger('create');
                    return;
                }
                $("h1").text(data[0].FormName);

                $.each(data, function (index, d) {
                    var gridLnk = "";

                    if (d.documentStatus == "Deleted") {
                        action = "Draft"
                        var gridLnk = '<tr>'
                       + '       <td><a href="#" class="ui-btn ui-btn-c ui-icon-back ui-btn-icon-notext ui-corner-all" title="Restore"  onClick="changeDocumentStatus(\'' + d.rowID + '\',\'' + action + '\')">Restore</a></td>'
                       + '       <td><a style="" href="formDetails.aspx?id=' + d.formID + '&row=' + d.rowID + '&time=' + new Date().getTime() + '"  rel="external" data-ajax="false"> <h2>' + d.documentTitle + '</h2><p><strong> ' + $.datepicker.formatDate('MM dd, yy', new Date(d.audit_UpdateDate)) + ' ' + new Date(d.audit_UpdateDate).getHours() + ':' + new Date(d.audit_UpdateDate).getMinutes() + ' ' + d.formStatus + '</strong></p></a></td>'
                       + '       <td><a href="#" class="ui-btn ui-btn-c ui-icon-delete ui-btn-icon-notext ui-corner-all" title="Delete"  onClick="if(confirm(\'Are you sure that you want to delete this form?\')){ changeDocumentStatus(\'' + d.rowID + '\',\'RemoveRecord\')}">Delete</a></td>'
                       + '</tr>'

                        $("#sectionIsEmpty").hide();
                        $("#delGridLnks").append(gridLnk).trigger('create');
                    

                    }
                    else if (d.documentStatus == "Submitted" || d.documentStatus == "Posted") {
                        //Nothing, do not populate Submitted documents
                    }
                    else {
                        action = "Deleted"
                        var gridLnk = '<tr>'
                       + '       <td><a href="formDetails.aspx?id=' + d.formID + '&row=' + d.rowID + '&time=' + new Date().getTime() + '"  rel="external" data-ajax="false"> <h2><strong> ' + d.documentTitle + '</strong> </h2><p>' + $.datepicker.formatDate('MM dd, yy', new Date(d.audit_UpdateDate)) + ' ' + new Date(d.audit_UpdateDate).getHours() + ':' + new Date(d.audit_UpdateDate).getMinutes() + ', ' + d.formStatus + '</strong><span style="color:red;padding:left:10px;">  ' + d.adminMessage + '<?span></p></a></td>'
                       + '       <td><a href="#" class="ui-btn ui-btn-c ui-icon-delete ui-btn-icon-notext ui-corner-all" title="Delete"  onClick="changeDocumentStatus(\'' + d.rowID + '\',\'' + action + '\')">Delete</a></td>'
                       + '</tr>'

                        $("#gridLnks").append(gridLnk).trigger('create');
                      
                    }


                });

            })
            .fail(function (jqXHR, textStatus, err) {
                var error = $.parseJSON(jqXHR.responseText);
                msg = "Error: The server responded with the following error (" + err + ") " + error.message;
                error = '<<tr><td colspan="32" style="color:red; text-align:center;">' + jqXHR.responseJSON.message + '</td></tr>';
                $("#gridLnks").append(error).trigger('create');
                //$("#gridLnks").listview('refresh');
                $("#doc-details-link").hide();
                //  console.log(msg);
            });
        }

        function changeDocumentStatus(rowID, action) {
            url = baseApiUrl + "/api/View_FormData/" + rowID + "?Action=" + action;
            $.ajax({
                url: url,
                async: true,
                cache: false,
                type: "Delete",
                headers: { 'Authorization': 'Bearer ' + token },
            })
             .done(function (data, status, jqXHR) {
                 msg = "Done";

             })
            .success(function (data, status, jqXHR) {
                AjaxLoader("a", "Please Wait", false)
                url = baseApiUrl + "/api/View_FormData/" + id;
                $("#gridLnks").html("");
                $("#delGridLnks").html("");
                loadDocuments(url);
                $.mobile.loading("hide");
            })
            .fail(function (jqXHR, textStatus, err) {
                var error = $.parseJSON(jqXHR.responseText);
                msg = "Error: The server responded with the following error (" + err + ") " + error.message;
                error = '<tr><td style="color:red; text-align:center;">' + jqXHR.responseJSON.message + '</td></tr>';

            })

        }


    </script>


</body>
</html>
