<!DOCTYPE html>
<html>
<head>
    <meta charset=utf-8 />
    <script src="http://code.jquery.com/jquery-1.7.2.min.js"></script>
    <link href="http://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css" rel="stylesheet" type="text/css" />
    <script src="http://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

    <title>JS Bin</title>
</head>
<body>
    <script type='text/javascript'>
		$(document).on("pageinit", function()
		{
			for(i = 1; i <= 2; i++)
			{
				var $orig = $("#orig");
				var $clone = $("#orig").clone(true);
				$clone.attr("id", "clone_id_" + i);
				var $target = $("#clone");

				$clone.find(".label").each(function()
				{
					var $rad = $(this);
					$rad.attr("for", $rad.attr("for") + "_clone_" + i);
				});
				$clone.find("input:radio").each(function()
				{
					var $rad = $(this);
					$rad.attr("name", $rad.attr("name") + "_clone_" + i);
					$rad.attr("id", $rad.attr("id") + "_clone_" + i);
				});




				$target.append($clone);
				$clone.find("input:radio").data("role", null).checkboxradio();
			}
		});

    </script>
    <div data-role="page">
        <form method="post" action="#">
            <div data-role="content">
                <div data-role="fieldcontain" id="customer-phone-info">

                    <div data-role="fieldcontain" id="customer-phone-info">
                        <fieldset data-role="controlgroup" data-mini="true" data-theme="d">
                            <div id="orig">
                                <input type='radio' id='orig_one' name='orig' value='one' data-role="none" />
                                <label for='orig_one' class='label'>One</label>

                                <input type='radio' id='orig_two' name='orig' value='two' data-role="none" />
                                <label for='orig_two' class='label'>Two</label>

                            </div>
                            <hr />
                        </fieldset>
                        <div id="clone"></div>
                    </div>
                </div>
</form>
    </div>
     

</body>
</html>
